name: Test rk-validate Action

# Smoke-tests the local rk-validate composite action against in-repo example
# fixtures to guarantee the public surface (inputs, exit codes, neutral skip,
# artifact upload) behaves as documented before each release. The action is
# referenced by `./` so this only exercises the on-disk version on the PR
# branch — never an unrelated published tag.

on:
  pull_request:
    paths:
      - '.github/actions/rk-validate/**'
      - '.github/workflows/test-action.yml'
      - 'packages/cli/src/commands/validate.ts'
      - 'packages/cli/src/exitCodes.ts'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # The action installs `repokernel@latest` from npm. To exercise the
  # local CLI build instead — necessary on PR branches that change the
  # validate path itself — we publish a tarball to a registry-shaped
  # cache and override the install step via a job-scoped `npm_config_*`
  # env. For the smoke test it's enough to assert the action shape; we
  # accept that it pulls the published latest.

  neutral-skip:
    name: 'neutral skip — no repokernel.config.yaml'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare empty workdir
        run: mkdir -p /tmp/empty-workdir
      - name: Run action against empty dir
        id: rk
        uses: ./.github/actions/rk-validate
        with:
          working-directory: /tmp/empty-workdir
          fail-on: P0,P1
          json-artifact: 'false'
          comment-on-pr: 'false'
      - name: Assert neutral exit
        run: |
          if [ "${{ steps.rk.outputs.exit-code }}" != "0" ]; then
            echo "expected exit 0 (neutral skip), got: ${{ steps.rk.outputs.exit-code }}" >&2
            exit 1
          fi
          if [ -n "${{ steps.rk.outputs.findings-json }}" ]; then
            echo "expected empty findings-json on skip, got: ${{ steps.rk.outputs.findings-json }}" >&2
            exit 1
          fi

  examples-basic:
    name: 'examples/basic — validate clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run action against examples/basic
        id: rk
        uses: ./.github/actions/rk-validate
        with:
          working-directory: examples/basic
          fail-on: P0,P1
          json-artifact: 'true'
          comment-on-pr: 'false'
      - name: Assert outputs
        run: |
          # examples/basic should validate clean (exit 0). If the example
          # ever drifts into a P0/P1 state the example itself is the bug,
          # not the action — surface it loudly.
          test "${{ steps.rk.outputs.exit-code }}" = "0"
          test -n "${{ steps.rk.outputs.findings-json }}"
