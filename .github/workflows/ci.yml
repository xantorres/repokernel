name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5

      - name: Enable corepack
        run: corepack enable

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check (lint + format)
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      - name: Smoke validate examples/basic
        run: node packages/cli/dist/index.js validate --cwd examples/basic

      - name: Smoke next on examples/basic
        run: node packages/cli/dist/index.js next --cwd examples/basic

      - name: Smoke registry --check on examples/basic
        run: node packages/cli/dist/index.js registry --check --cwd examples/basic

      - name: Smoke init --example in fresh repo
        run: |
          tmp="$(mktemp -d)"
          git -c init.defaultBranch=main -C "$tmp" init
          node packages/cli/dist/index.js init --example --cwd "$tmp"
          node packages/cli/dist/index.js validate --cwd "$tmp"
          node packages/cli/dist/index.js next --cwd "$tmp"
          node packages/cli/dist/index.js registry --check --cwd "$tmp"

      - name: Smoke rk run --dry-run and rk runs
        run: |
          tmp="$(mktemp -d)"
          git -c init.defaultBranch=main -C "$tmp" init
          node packages/cli/dist/index.js init --example --cwd "$tmp"
          node packages/cli/dist/index.js run E-001 --dry-run --no-worktree --cwd "$tmp"
          node packages/cli/dist/index.js runs --cwd "$tmp"

      - name: Smoke review-sprint and review-panel CLI surface
        run: |
          node packages/cli/dist/index.js review-sprint --help
          node packages/cli/dist/index.js review-panel --help

      - name: Smoke rk run parallel epic E2E (epic config drives strategy)
        run: |
          tmp="$(mktemp -d)"
          git -c init.defaultBranch=main -C "$tmp" init
          git -C "$tmp" config user.email "ci@repokernel.dev"
          git -C "$tmp" config user.name "RepoKernel CI"
          cp -r examples/parallel/. "$tmp/"
          git -C "$tmp" add -A
          git -C "$tmp" commit -m "init parallel fixture"
          node packages/cli/dist/index.js run E-001 \
            --agent fake \
            --concurrency 2 \
            --mode autonomous \
            --cwd "$tmp"

      - name: Smoke --parallel assertion rejects sequential epic
        run: |
          tmp="$(mktemp -d)"
          git -c init.defaultBranch=main -C "$tmp" init
          node packages/cli/dist/index.js init --example --cwd "$tmp"
          if node packages/cli/dist/index.js run E-001 \
              --agent fake \
              --parallel \
              --dry-run \
              --no-worktree \
              --cwd "$tmp" 2>/dev/null; then
            echo "ERROR: --parallel on sequential epic should have failed" && exit 1
          fi
          echo "Correctly rejected --parallel on sequential epic"
