name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5

      - name: Enable corepack
        run: corepack enable

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check (lint + format)
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      - name: Smoke validate examples/basic
        run: node packages/cli/dist/index.js validate --cwd examples/basic

      - name: Smoke next on examples/basic
        run: node packages/cli/dist/index.js next --cwd examples/basic

      - name: Smoke registry --check on examples/basic
        run: node packages/cli/dist/index.js registry --check --cwd examples/basic

      - name: Smoke init --example in fresh repo
        run: |
          tmp="$(mktemp -d)"
          git -C "$tmp" init
          node packages/cli/dist/index.js init --example --cwd "$tmp"
          node packages/cli/dist/index.js validate --cwd "$tmp"
          node packages/cli/dist/index.js next --cwd "$tmp"
          node packages/cli/dist/index.js registry --check --cwd "$tmp"

      - name: Smoke rk run --dry-run and rk runs
        run: |
          tmp="$(mktemp -d)"
          git -C "$tmp" init
          node packages/cli/dist/index.js init --example --cwd "$tmp"
          node packages/cli/dist/index.js run E-001 --dry-run --no-worktree --cwd "$tmp"
          node packages/cli/dist/index.js runs --cwd "$tmp"
