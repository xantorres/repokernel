name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      - name: Coverage
        run: pnpm -r test:coverage

      - name: Pack dry run
        run: pnpm pack --dry-run
        working-directory: packages/cli

      - name: Pack tarball
        run: pnpm pack --pack-destination /tmp/rk-pack
        working-directory: packages/cli

      - name: Smoke test installed tarball
        run: |
          set -euo pipefail
          tarball=$(ls /tmp/rk-pack/repokernel-*.tgz | head -n1)
          if [ -z "$tarball" ]; then
            echo "::error::no tarball produced by pnpm pack"
            exit 1
          fi
          npm install -g "$tarball"
          rk --version
          smoke=$(mktemp -d)
          cd "$smoke"
          git init -q
          git config user.email rk-smoke@example.com
          git config user.name rk-smoke
          rk init
          rk validate || true

      - name: Publish repokernel
        run: pnpm publish --no-git-checks
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
