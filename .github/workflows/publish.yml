name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      - name: Coverage
        run: pnpm -r test:coverage

      - name: Pack dry run
        run: pnpm pack --dry-run
        working-directory: packages/cli

      - name: Pack tarball
        run: pnpm pack --pack-destination /tmp/rk-pack
        working-directory: packages/cli

      - name: Install tarball globally and verify
        run: |
          set -euo pipefail
          tarball=$(ls /tmp/rk-pack/repokernel-*.tgz | head -n1)
          if [ -z "$tarball" ]; then
            echo "::error::no tarball produced by pnpm pack"
            exit 1
          fi
          # Install with visible output so any npm errors surface in the log.
          npm install -g --no-fund --no-audit "$tarball"
          # Locate the installed binary via npm root to avoid PATH ambiguity.
          rk_bin="$(npm root -g)/repokernel/dist/index.js"
          if [ ! -f "$rk_bin" ]; then
            echo "::error::rk not found at $rk_bin after global install" >&2
            ls "$(npm root -g)/" >&2 || true
            exit 1
          fi
          node "$rk_bin" --version
          # Export for the smoke-test steps below.
          echo "RK_INSTALLED_BIN=$rk_bin" >> "$GITHUB_ENV"

      - name: Smoke test installed tarball — default layout
        run: |
          tarball=$(ls /tmp/rk-pack/repokernel-*.tgz | head -n1)
          # Use RK_BIN to invoke the installed binary explicitly so PATH
          # differences across CI environments don't affect the smoke test.
          RK_BIN="$RK_INSTALLED_BIN" RK_SMOKE_LAYOUT=default \
            bash scripts/smoke-fastpath.sh "$tarball"

      - name: Smoke test installed tarball — docs layout
        run: |
          tarball=$(ls /tmp/rk-pack/repokernel-*.tgz | head -n1)
          # Rewrites the config to put sprints/reviews/queues under docs/.
          # Catches custom-config-path regressions in the close-merge
          # transaction (see closeTask.ts commitWorktreeRkMetadata).
          RK_BIN="$RK_INSTALLED_BIN" RK_SMOKE_LAYOUT=docs-layout \
            bash scripts/smoke-fastpath.sh "$tarball"

      # Order matters: npm is the source of truth for package availability.
      # Publish first so a bad npm token cannot leave a GitHub release for an
      # unpublished version. GitHub release creation is idempotent and can be
      # rerun safely if it fails after npm publish succeeds.
      - name: Publish repokernel
        run: pnpm publish --no-git-checks
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          # Match the heading by literal string (awk index) so dots in the
          # version are not treated as regex any-char. Accept both ASCII
          # hyphen and em-dash separators since older CHANGELOG entries
          # mix the two.
          awk -v version="$version" '
            index($0, "## [" version "] - ") == 1 || index($0, "## [" version "] \xe2\x80\x94 ") == 1 {
              capture=1; next
            }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::CHANGELOG.md has no section for $tag (looked for '## [$version] - ' or '## [$version] — ')" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --title "$tag" --notes-file "$notes" --verify-tag
          fi
