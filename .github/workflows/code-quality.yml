# Fails a PR only on dead code, duplication, or complexity it introduces.
# Existing debt is captured in fallow-baselines/ and does not block (ratchet).
name: Code Quality
on: [pull_request]
permissions:
  contents: read
  pull-requests: write
  security-events: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: fallow-rs/fallow@v2
        with:
          command: audit
          gate: new-only
          dead-code-baseline: fallow-baselines/dead-code.json
          health-baseline: fallow-baselines/health.json
          dupes-baseline: fallow-baselines/dupes.json
          comment: true
          review-comments: true
          sarif: true
          fail-on-issues: true
          changed-workspaces: origin/${{ github.base_ref }}
