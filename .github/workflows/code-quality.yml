name: Code Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare trusted baseline inputs
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          base_ref="${GITHUB_BASE_REF:+origin/$GITHUB_BASE_REF}"
          if [ -z "$base_ref" ]; then
            base_ref="$EVENT_BEFORE"
          fi
          if [ -z "$base_ref" ] || [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
            base_ref="HEAD~1"
          fi

          baseline_dir="$RUNNER_TEMP/fallow-baselines"
          mkdir -p "$baseline_dir"
          for file in dead-code.json health.json dupes.json; do
            path="fallow-baselines/$file"
            if git cat-file -e "$base_ref:$path" 2>/dev/null; then
              git show "$base_ref:$path" > "$baseline_dir/$file"
            else
              cp "$path" "$baseline_dir/$file"
            fi
          done

          echo "FALLOW_BASE_REF=$base_ref" >> "$GITHUB_ENV"
          echo "FALLOW_BASELINE_DIR=$baseline_dir" >> "$GITHUB_ENV"

      - name: Check baseline drift
        run: pnpm quality:baseline:check

      # Without coverage data the health analysis scores CRAP as if nothing were
      # tested, so a five-branch function fails the gate on complexity it does not
      # have. Istanbul format is required; the test job's own coverage is v8.
      - name: Build workspace
        run: pnpm -r build

      - name: Generate coverage for complexity scoring
        run: pnpm --filter repokernel test:coverage:istanbul

      - name: Audit changed files
        env:
          FALLOW_COVERAGE: ${{ github.workspace }}/packages/cli/coverage/coverage-final.json
        run: pnpm quality:audit
